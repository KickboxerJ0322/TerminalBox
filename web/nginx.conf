server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  location = / {
    return 302 /terminalbox/;
  }

  location = /terminalbox {
    return 301 /terminalbox/;
  }

  location /terminalbox/ {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location /api/ {
    proxy_pass http://terminalbox-backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_buffering off;
  }

  location = /target-site {
    return 301 /target-site/;
  }

  location /target-site/ {
    proxy_pass http://target:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
  }

  location = /target-site-2 {
    return 301 /target-site-2/;
  }

  location /target-site-2/ {
    proxy_pass http://target2:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target2;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
  }

  location = /target-site-3 {
    return 301 /target-site-3/;
  }

  location /target-site-3/ {
    proxy_pass http://target3:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target3;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
  }

  location /ws/ {
    proxy_pass http://terminalbox-backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /kali-gui {
    return 301 /kali-gui/;
  }

  location /kali-gui/ {
    proxy_pass http://kali:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /assets/ {
    try_files $uri =404;
  }
}
