name: terminalbox

services:
  terminalbox-web:
    build: ./web
    container_name: terminalbox-web
    ports:
      - "127.0.0.1:${PORT:-3000}:80"
    depends_on:
      terminalbox-backend:
        condition: service_healthy
      target2:
        condition: service_healthy
      target3:
        condition: service_healthy
      challenge-target:
        condition: service_healthy
    networks:
      - edge
      - lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  terminalbox-backend:
    build: ./backend
    container_name: terminalbox-backend
    environment:
      PORT: 3001
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-LiquidAI/lfm2.5-1.2b-instruct:q4_k_m}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_URL: ${GEMINI_URL:-https://generativelanguage.googleapis.com}
      TARGET_URL: ${TARGET_URL:-http://target:3000}
      TARGET_URLS: ${TARGET_URLS:-http://target:3000,http://target2:3000,http://target3:3000,http://labtarget:3100}
      KALI_GUI_URL: ${KALI_GUI_URL:-http://kali:6080}
      TERMINAL_HISTORY_LIMIT: ${TERMINAL_HISTORY_LIMIT:-6000}
      KALI_CONTAINER: ${KALI_CONTAINER:-terminalbox-kali}
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000},http://127.0.0.1:3000,http://terminalbox-web
      AI_SYSTEM_PROMPT_FILE: /app/config/ai-system-prompt.txt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kali:
        condition: service_healthy
      target:
        condition: service_healthy
      challenge-target:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - edge
      - lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  kali:
    build:
      context: .
      dockerfile: kali/Dockerfile
    container_name: terminalbox-kali
    hostname: kali
    environment:
      KALI_VNC_PASSWORD: ${KALI_VNC_PASSWORD:-student}
      KALI_VNC_GEOMETRY: ${KALI_VNC_GEOMETRY:-1440x900}
    networks:
      - lab
    restart: unless-stopped
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /run:rw,nosuid,nodev,size=32m
      - /run/user/1000:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /home/student:rw,nosuid,nodev,size=2g,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    pids_limit: 512
    mem_limit: ${KALI_MEMORY_LIMIT:-6g}
    cpus: ${KALI_CPU_LIMIT:-2.0}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "-c", "getent hosts target >/dev/null && pgrep -x Xtigervnc >/dev/null && pgrep -f 'websockify.*6080' >/dev/null && wget -q -O /dev/null http://127.0.0.1:6080/"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  target:
    build: ./target
    container_name: terminalbox-target
    hostname: target
    environment:
      TARGET_PROFILE: "1"
    init: true
    networks:
      - lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/api/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  target2:
    build: ./target
    container_name: terminalbox-target-2
    hostname: target2
    init: true
    environment:
      TARGET_PROFILE: "2"
    networks:
      - lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/api/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  target3:
    build: ./target
    container_name: terminalbox-target-3
    hostname: target3
    init: true
    environment:
      TARGET_PROFILE: "3"
    networks:
      - lab
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/api/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  challenge-target:
    build: ./challenge-target
    container_name: terminalbox-challenge-target
    hostname: labtarget
    init: true
    networks:
      lab:
        aliases:
          - labtarget
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3100/api/status', timeout=8)"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: terminalbox-ollama
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - edge
      - lab
    restart: unless-stopped
    pids_limit: 512
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-10g}
    cpus: ${OLLAMA_CPU_LIMIT:-4.0}
    security_opt:
      - no-new-privileges:true

  model-loader:
    image: ollama/ollama:latest
    profiles: ["model"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-LiquidAI/lfm2.5-1.2b-instruct:q4_k_m}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        exec ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      - ollama
    networks:
      - edge
    restart: "no"

volumes:
  ollama-models:

networks:
  edge:
    driver: bridge
  lab:
    driver: bridge
    internal: true
