map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  absolute_redirect off;

  location = /target-site { return 301 /target-site/; }
  location = /target-site-2 { return 301 /target-site-2/; }
  location = /target-site-3 { return 301 /target-site-3/; }
  location = /kali-gui { return 301 /kali-gui/; }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /ws/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /target-site/ {
    proxy_pass http://127.0.0.2:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;
  }

  location /target-site-2/ {
    proxy_pass http://127.0.0.3:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target2;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;
  }

  location /target-site-3/ {
    proxy_pass http://127.0.0.4:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host target3;
    proxy_buffering off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;
  }

  location /kali-gui/ {
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / { return 404; }
}
